# Builds the SaaS/on-premise image on every push to main and on version tags.
# - Pushed to GitHub Container Registry: ghcr.io/<owner>/<repo>:latest and :<sha>
# - Also attached as a downloadable artifact (for servers that cannot reach ghcr.io:
#   download, then `gunzip -c unifinance-image.tar.gz | docker load`).
# Repository secret LICENSE_PUBLIC_KEY = contents of deploy/saas/keys/license-public.key
# (without it the image is built without licensing, i.e. unlimited).
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            unifinance:latest
          build-args: |
            LICENSE_PUBLIC_KEY=${{ secrets.LICENSE_PUBLIC_KEY }}
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save unifinance:latest | gzip > unifinance-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: unifinance-image
          path: unifinance-image.tar.gz
          retention-days: 30
