basePath: /api/v1
definitions:
  handlers.AdvisorDebtDTO:
    properties:
      advisor_id:
        type: integer
      advisor_name:
        type: string
      debt_cents:
        type: integer
    type: object
  handlers.AuthResultDoc:
    properties:
      tokens:
        $ref: '#/definitions/handlers.AuthTokensDoc'
      user:
        $ref: '#/definitions/handlers.AuthUserDoc'
    type: object
  handlers.AuthTokensDoc:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  handlers.AuthUserDoc:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      role:
        type: string
    type: object
  handlers.DashboardKPIsDTO:
    properties:
      active_students:
        type: integer
      monthly_payroll_cents:
        type: integer
      overdue_debt_cents:
        type: integer
      pending_debt_cents:
        type: integer
      total_revenue_cents:
        type: integer
    type: object
  handlers.DashboardSummaryResponse:
    properties:
      debt_alerts:
        items:
          $ref: '#/definitions/handlers.DebtAlertDTO'
        type: array
      kpis:
        $ref: '#/definitions/handlers.DashboardKPIsDTO'
      recent_payments:
        items:
          $ref: '#/definitions/handlers.PaymentDTO'
        type: array
    type: object
  handlers.DebtAlertDTO:
    properties:
      amount_cents:
        type: integer
      days_overdue:
        type: integer
      student_id:
        type: integer
      student_name:
        type: string
    type: object
  handlers.NotificationSettingDTO:
    properties:
      enabled:
        type: boolean
      type:
        type: string
    type: object
  handlers.OrganizationSettingsDTO:
    properties:
      address:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
    type: object
  handlers.PaymentDTO:
    properties:
      amount_cents:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      due_date:
        type: string
      enrollment_id:
        type: integer
      id:
        type: integer
      method:
        type: string
      paid_at:
        type: string
      plan_name:
        type: string
      reference_code:
        type: string
      status:
        type: string
      student_id:
        type: integer
      student_name:
        type: string
    type: object
  handlers.PaymentSettingsDTO:
    properties:
      card_number:
        type: string
      gateway_callback_url:
        type: string
      gateway_merchant_id:
        type: string
      gateway_provider:
        type: string
      iban:
        type: string
      is_gateway_connected:
        type: boolean
    type: object
  handlers.PayrollEntryDTO:
    properties:
      base_salary_cents:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      paid_at:
        type: string
      period_month:
        type: integer
      period_year:
        type: integer
      status:
        type: string
      students_count:
        type: integer
      total_salary_cents:
        type: integer
      user_first_name:
        type: string
      user_id:
        type: integer
      user_last_name:
        type: string
      user_role:
        type: string
      variable_salary_cents:
        type: integer
    type: object
  handlers.PayrollPointDTO:
    properties:
      month:
        type: integer
      payroll_cents:
        type: integer
      year:
        type: integer
    type: object
  handlers.PayrollSchemeDTO:
    properties:
      base_salary_cents:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      monthly_bonus_cents:
        type: integer
      per_student_cents:
        type: integer
      revenue_percent:
        type: number
      role:
        type: string
    type: object
  handlers.PayrollSummaryDTO:
    properties:
      period_month:
        type: integer
      period_year:
        type: integer
      total_base_cents:
        type: integer
      total_paid_cents:
        type: integer
      total_pending_cents:
        type: integer
      total_variable_cents:
        type: integer
    type: object
  handlers.PlanDTO:
    properties:
      created_at:
        type: string
      description:
        type: string
      features:
        items:
          type: string
        type: array
      id:
        type: integer
      interval:
        type: string
      is_active:
        type: boolean
      max_users:
        type: integer
      name:
        type: string
      price_cents:
        type: integer
      type:
        type: string
      updated_at:
        type: string
    type: object
  handlers.PlanSummaryDTO:
    properties:
      active_enrollments:
        type: integer
      active_plans:
        type: integer
      monthly_revenue_cents:
        type: integer
      total_plans:
        type: integer
    type: object
  handlers.ProfileDTO:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      permissions:
        items:
          type: string
        type: array
      phone:
        type: string
      role:
        type: string
      two_factor_enabled:
        type: boolean
    type: object
  handlers.ReportSummaryDTO:
    properties:
      net_profit_cents:
        type: integer
      total_debt_cents:
        type: integer
      total_payroll_cents:
        type: integer
      total_revenue_cents:
        type: integer
    type: object
  handlers.RevenuePointDTO:
    properties:
      month:
        type: integer
      revenue_cents:
        type: integer
      year:
        type: integer
    type: object
  handlers.RevenueTrendPointDTO:
    properties:
      month:
        type: integer
      payroll_cents:
        type: integer
      revenue_cents:
        type: integer
      year:
        type: integer
    type: object
  handlers.StudentDoc:
    properties:
      advisor_id:
        type: integer
      advisor_name:
        type: string
      balance_cents:
        type: integer
      current_plan_id:
        type: integer
      current_plan_name:
        type: string
      email:
        type: string
      father_phone:
        type: string
      first_name:
        type: string
      home_address:
        type: string
      id:
        type: integer
      last_name:
        type: string
      mother_phone:
        type: string
      phone:
        type: string
      school_address:
        type: string
      school_name:
        type: string
      status:
        type: string
    type: object
  handlers.StudentStatsDoc:
    properties:
      active:
        type: integer
      debtors:
        type: integer
      inactive:
        type: integer
      total:
        type: integer
    type: object
  handlers.UserDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        type: string
      organization_id:
        type: integer
      permissions:
        description: only for GET when caller has USERS permission
        items:
          type: string
        type: array
      phone:
        type: string
      role:
        type: string
    type: object
  handlers.UserRoleStatsDoc:
    properties:
      accountants:
        type: integer
      admins:
        type: integer
      advisors:
        type: integer
      operators:
        type: integer
    type: object
  handlers.changePasswordRequest:
    properties:
      current_password:
        minLength: 6
        type: string
      new_password:
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  handlers.createPaymentRequest:
    properties:
      amount_cents:
        type: integer
      currency:
        type: string
      description:
        maxLength: 500
        type: string
      due_date:
        type: string
      enrollment_id:
        type: integer
      method:
        type: string
      paid_at:
        type: string
      reference_number:
        maxLength: 255
        type: string
      status:
        type: string
      student_id:
        type: integer
    required:
    - amount_cents
    - method
    - status
    - student_id
    type: object
  handlers.createPayrollEntryRequest:
    properties:
      base_salary_cents:
        minimum: 0
        type: integer
      period_month:
        maximum: 12
        minimum: 1
        type: integer
      period_year:
        type: integer
      status:
        enum:
        - PAID
        - PENDING
        type: string
      students_count:
        minimum: 0
        type: integer
      user_id:
        type: integer
      variable_salary_cents:
        minimum: 0
        type: integer
    required:
    - base_salary_cents
    - period_month
    - period_year
    - status
    - user_id
    type: object
  handlers.createPlanRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      features:
        items:
          type: string
        type: array
      interval:
        enum:
        - monthly
        - yearly
        type: string
      is_active:
        type: boolean
      max_users:
        type: integer
      name:
        maxLength: 255
        minLength: 2
        type: string
      price_cents:
        type: integer
      type:
        maxLength: 50
        type: string
    required:
    - features
    - interval
    - name
    - price_cents
    type: object
  handlers.createUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      is_active:
        type: boolean
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      organization_id:
        type: integer
      password:
        minLength: 8
        type: string
      phone:
        maxLength: 20
        type: string
      role:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - role
    type: object
  handlers.forgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.loginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  handlers.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.registerRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  handlers.resetPasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  handlers.toggleTwoFARequest:
    properties:
      enabled:
        type: boolean
    type: object
  handlers.updateNotificationsRequest:
    properties:
      settings:
        items:
          $ref: '#/definitions/handlers.NotificationSettingDTO'
        type: array
    required:
    - settings
    type: object
  handlers.updateOrganizationRequest:
    properties:
      address:
        maxLength: 500
        type: string
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      phone:
        maxLength: 20
        type: string
    type: object
  handlers.updatePaymentRequest:
    properties:
      amount_cents:
        type: integer
      description:
        maxLength: 500
        type: string
      due_date:
        type: string
      enrollment_id:
        type: integer
      method:
        type: string
      paid_at:
        type: string
      reference_number:
        maxLength: 255
        type: string
      status:
        type: string
    type: object
  handlers.updatePaymentSettingsRequest:
    properties:
      card_number:
        maxLength: 32
        type: string
      gateway_callback_url:
        maxLength: 255
        type: string
      gateway_merchant_id:
        maxLength: 128
        type: string
      gateway_provider:
        maxLength: 50
        type: string
      iban:
        maxLength: 50
        type: string
      is_gateway_connected:
        type: boolean
    type: object
  handlers.updatePayrollEntryRequest:
    properties:
      base_salary_cents:
        minimum: 0
        type: integer
      status:
        enum:
        - PAID
        - PENDING
        type: string
      students_count:
        minimum: 0
        type: integer
      variable_salary_cents:
        minimum: 0
        type: integer
    type: object
  handlers.updatePlanRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      features:
        items:
          type: string
        type: array
      interval:
        enum:
        - monthly
        - yearly
        type: string
      is_active:
        type: boolean
      max_users:
        type: integer
      name:
        maxLength: 255
        minLength: 2
        type: string
      price_cents:
        type: integer
      type:
        maxLength: 50
        type: string
    required:
    - features
    type: object
  handlers.updateProfileRequest:
    properties:
      avatar_url:
        maxLength: 512
        type: string
      bio:
        type: string
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        maxLength: 20
        type: string
    type: object
  handlers.updateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      is_active:
        type: boolean
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      organization_id:
        type: integer
      password:
        description: admin can set user password
        minLength: 8
        type: string
      permissions:
        items:
          type: string
        type: array
      phone:
        maxLength: 20
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for Unifinance Momtaz dashboard
  title: Unifinance Momtaz API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset link (stubbed, no email integration yet)
      parameters:
      - description: Forgot password data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Forgot password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password and get access & refresh
        tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResultDoc'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Logout current user (stateless JWT, client should discard tokens)
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthUserDoc'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Use refresh token to get new access & refresh tokens
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResultDoc'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user and return access & refresh tokens
      parameters:
      - description: Register data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.AuthResultDoc'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset password using a reset token (currently not implemented)
      parameters:
      - description: Reset password data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password
      tags:
      - auth
  /dashboard/debt-alerts:
    get:
      description: List of overdue payment alerts for the dashboard
      parameters:
      - default: 5
        description: Number of alerts to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.DebtAlertDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Debt alerts
      tags:
      - dashboard
  /dashboard/recent-payments:
    get:
      description: List of the most recent payments for the dashboard table
      parameters:
      - default: 5
        description: Number of recent payments to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.PaymentDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Recent payments
      tags:
      - dashboard
  /dashboard/revenue-trend:
    get:
      description: Monthly aggregated revenue (payments) and payroll amounts for charts
      parameters:
      - default: 6
        description: How many recent months to include (including current)
        in: query
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.RevenueTrendPointDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revenue vs payroll trend
      tags:
      - dashboard
  /dashboard/summary:
    get:
      description: High-level KPIs, recent payments and debt alerts for the dashboard
        widgets
      parameters:
      - default: 5
        description: Number of recent payments to include
        in: query
        name: recent_limit
        type: integer
      - default: 5
        description: Number of debt alerts to include
        in: query
        name: alerts_limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DashboardSummaryResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Dashboard summary
      tags:
      - dashboard
  /payments:
    get:
      description: Paginated list of payments with filters (admin only)
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Search by student name, description, reference
        in: query
        name: search
        type: string
      - description: Status filter
        in: query
        name: status
        type: string
      - description: Method filter
        in: query
        name: method
        type: string
      - description: From date (YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      - description: Sort field (e.g. -created_at,amount)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List payments
      tags:
      - payments
    post:
      consumes:
      - application/json
      description: Manually register a payment (admin only)
      parameters:
      - description: Payment data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.createPaymentRequest'
      produces:
      - application/json
